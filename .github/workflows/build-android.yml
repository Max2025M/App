name: Build APK SMSApp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Java e Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk gradle

    - name: Gerar keystore temporário
      run: |
        KEYSTORE_FILE="temp-release-key.keystore"
        KEY_ALIAS="tempkey"
        STOREPASS="123456"
        KEYPASS="123456"
        keytool -genkeypair -v \
          -keystore $KEYSTORE_FILE \
          -alias $KEY_ALIAS \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -storepass $STOREPASS \
          -keypass $KEYPASS \
          -dname "CN=Temp, OU=Dev, O=GitHub, L=City, S=State, C=PT"
        echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
        echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
        echo "STOREPASS=$STOREPASS" >> $GITHUB_ENV
        echo "KEYPASS=$KEYPASS" >> $GITHUB_ENV

    - name: Build APK nativo via Gradle
      run: ./gradlew assembleRelease

    - name: Assinar e alinhar APK
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
        -keystore $KEYSTORE_FILE \
        -storepass $STOREPASS \
        -keypass $KEYPASS \
        app/build/outputs/apk/release/app-release-unsigned.apk $KEY_ALIAS

        zipalign -v 4 \
        app/build/outputs/apk/release/app-release-unsigned.apk \
        app/build/outputs/apk/release/app-release-signed.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SMSApp-TermuxAPI-Release
        path: app/build/outputs/apk/release/app-release-signed.apk

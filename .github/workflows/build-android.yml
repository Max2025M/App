name: Build Android APK Assinado Automaticamente

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Instalar Cordova
      run: npm install -g cordova

    - name: Instalar dependências do projeto
      run: npm install

    - name: Remover plataforma Android (limpar cache)
      run: cordova platform rm android || true

    - name: Adicionar plataforma Android
      run: cordova platform add android

    - name: Adicionar plugin Termux API embutido
      run: cordova plugin add ./cordova-plugin-termux-api

    - name: Compilar APK (unsigned)
      run: cordova build android --release -- --packageType=apk

    - name: Gerar Keystore temporário
      run: |
        KEYSTORE_FILE="temp-release-key.keystore"
        KEY_ALIAS="tempkey"
        STOREPASS="123456"
        KEYPASS="123456"
        keytool -genkeypair -v \
          -keystore $KEYSTORE_FILE \
          -alias $KEY_ALIAS \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -storepass $STOREPASS \
          -keypass $KEYPASS \
          -dname "CN=Temp, OU=Dev, O=GitHub, L=City, S=State, C=PT"
        echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> $GITHUB_ENV
        echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
        echo "STOREPASS=$STOREPASS" >> $GITHUB_ENV
        echo "KEYPASS=$KEYPASS" >> $GITHUB_ENV

    - name: Assinar APK
      run: |
        jarsigner -verbose \
          -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore $KEYSTORE_FILE \
          -storepass $STOREPASS \
          -keypass $KEYPASS \
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk $KEY_ALIAS

    - name: Alinhar APK
      run: |
        sudo apt-get install -y zipalign
        zipalign -v 4 \
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
          platforms/android/app/build/outputs/apk/release/app-release-signed.apk

    - name: Enviar APK assinado como artefato
      uses: actions/upload-artifact@v4
      with:
        name: SMSApp-TermuxAPI-Release
        path: platforms/android/app/build/outputs/apk/release/app-release-signed.apk

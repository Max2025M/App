<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMSApp - Envio de SMS</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  header {
    width: 100%;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: #fff;
    text-align: center;
    padding: 20px 10px;
    font-size: 1.5rem;
    font-weight: bold;
    position: relative;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #simSelect {
    padding: 6px 10px;
    border-radius: 8px;
    border: none;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
  }

  main {
    width: 90%;
    max-width: 500px;
    background: #fff;
    margin-top: 20px;
    border-radius: 15px;
    padding: 25px 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  input, textarea {
    width: 100%;
    padding: 12px 15px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1rem;
    box-sizing: border-box;
    transition: 0.3s;
  }

  input:focus, textarea:focus {
    border-color: #0072ff;
    outline: none;
    box-shadow: 0 0 5px rgba(0,114,255,0.3);
  }

  button {
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: #fff;
    border: none;
    padding: 12px;
    font-size: 1.1rem;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
  }

  button:hover { opacity: 0.85; }

  .status-container { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  .status-card {
    background: #f9f9f9;
    border: 1px solid #ddd;
    border-left: 5px solid #0072ff;
    border-radius: 10px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
  }

  .status-success { color: green; font-weight: bold; }
  .status-error { color: red; font-weight: bold; }

  .btn-small {
    background: #0072ff;
    color: #fff;
    border: none;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    margin-left: 5px;
    transition: 0.3s;
  }

  .btn-small:hover { opacity: 0.85; }

  @media (max-width: 600px) {
    header { flex-direction: column; font-size: 1.3rem; padding: 15px; }
    main { padding: 20px; }
    button { font-size: 1rem; padding: 10px; }
  }
</style>
</head>
<body>

<header>
  SMSApp
  <select id="simSelect"></select>
</header>

<main>
  <label for="numeros">Números de telefone (separados por vírgula):</label>
  <textarea id="numeros" rows="3" placeholder="Ex: 841234567,842345678"></textarea>

  <label for="mensagem">Digite a mensagem:</label>
  <textarea id="mensagem" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>

  <button id="enviar">Iniciar envio</button>

  <div class="status-container" id="statusContainer"></div>
</main>

<script src="cordova.js"></script>
<script>
document.addEventListener("deviceready", () => {
  const simSelect = document.getElementById("simSelect");
  const numerosInput = document.getElementById("numeros");
  const mensagemInput = document.getElementById("mensagem");
  const enviarBtn = document.getElementById("enviar");
  const statusContainer = document.getElementById("statusContainer");

  // Detectar SIMs reais
  function carregarSIMs() {
    if(window.SIM && SIM.getSimInfo) {
      SIM.getSimInfo((sims) => {
        if(sims.length === 0) {
          simSelect.innerHTML = '<option value="0">SIM1</option>';
          return;
        }
        sims.forEach((sim, index) => {
          let option = document.createElement("option");
          option.value = index;
          option.textContent = sim.displayName || `SIM${index+1}`;
          simSelect.appendChild(option);
        });
      }, () => { simSelect.innerHTML = '<option value="0">SIM1</option>'; });
    } else {
      simSelect.innerHTML = '<option value="0">SIM1</option>';
    }
  }

  carregarSIMs();

  function enviarSMS(numero, mensagem, simIndex, card) {
    SMS.send({phoneNumber: "+258"+numero, message: mensagem, simSlot: simIndex})
      .then(() => {
        card.innerHTML = `<strong>${numero}</strong><span class="status-success">✅ Enviado (SIM ${simIndex+1})</span>
        <div>
          <button class="btn-small" onclick="this.parentNode.parentNode.remove()">Excluir</button>
          <button class="btn-small" onclick="reenviar('${numero}', ${simIndex}, this)">Reenviar</button>
        </div>`;
      })
      .catch(() => {
        card.innerHTML = `<strong>${numero}</strong><span class="status-error">❌ Erro</span>
        <div>
          <button class="btn-small" onclick="this.parentNode.parentNode.remove()">Excluir</button>
          <button class="btn-small" onclick="reenviar('${numero}', ${simIndex}, this)">Reenviar</button>
        </div>`;
      });
  }

  enviarBtn.addEventListener("click", () => {
    const mensagem = mensagemInput.value.trim();
    const numeros = numerosInput.value.replace(/[^0-9,]/g,"").split(",").flatMap(n => n.match(/\d{9}/g) || []);
    const simIndex = parseInt(simSelect.value);

    if(!mensagem || numeros.length === 0) { alert("Preencha todos os campos."); return; }
    statusContainer.innerHTML = "";

    numeros.forEach(num => {
      const card = document.createElement("div");
      card.className = "status-card";
      card.innerHTML = `<strong>${num}</strong><span>Enviando...</span>`;
      statusContainer.appendChild(card);
      enviarSMS(num, mensagem, simIndex, card);
    });
  });
});

function reenviar(numero, simIndex, btn) {
  const card = btn.closest(".status-card");
  const mensagem = document.getElementById("mensagem").value.trim();
  card.querySelector("span").textContent = "Reenviando...";
  SMS.send({phoneNumber: "+258"+numero, message: mensagem, simSlot: simIndex})
    .then(() => { card.querySelector("span").textContent = "✅ Reenviado"; })
    .catch(() => { card.querySelector("span").textContent = "❌ Erro no reenvio"; });
}
</script>
</body>
</html>

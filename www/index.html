<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMSApp - Termux API</title>
<style>
body { font-family:'Poppins',sans-serif; background:#f0f4f8; margin:0; padding:0; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
header { width:100%; background:linear-gradient(90deg,#00c6ff,#0072ff); color:#fff; padding:20px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 6px rgba(0,0,0,0.1);}
#simSelect { padding:6px 10px; border-radius:8px; border:none; font-weight:bold;}
main { width:90%; max-width:500px; background:#fff; margin-top:20px; border-radius:15px; padding:25px 20px; box-shadow:0 6px 15px rgba(0,0,0,0.1); display:flex; flex-direction:column; gap:15px;}
input,textarea { width:100%; padding:12px 15px; border-radius:10px; border:1px solid #ccc; font-size:1rem; box-sizing:border-box;}
button { background:linear-gradient(90deg,#00c6ff,#0072ff); color:#fff; border:none; padding:12px; font-size:1.1rem; border-radius:10px; cursor:pointer; font-weight:bold;}
button:hover {opacity:0.85;}
.status-container { margin-top:20px; display:flex; flex-direction:column; gap:12px; }
.status-card { background:#f9f9f9; border:1px solid #ddd; border-left:5px solid #0072ff; border-radius:10px; padding:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:5px;}
.status-success { color:green; font-weight:bold; }
.status-error { color:red; font-weight:bold; }
.btn-small { background:#0072ff; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:0.85rem; cursor:pointer; margin-left:5px; }
.btn-small:hover { opacity:0.85; }
</style>
</head>
<body>

<header>
  SMSApp
  <select id="simSelect"></select>
</header>

<main>
  <label for="numeros">Números de telefone:</label>
  <textarea id="numeros" rows="3" placeholder="Ex: 841234567,842345678"></textarea>

  <label for="mensagem">Mensagem:</label>
  <textarea id="mensagem" rows="4" placeholder="Escreva sua mensagem..."></textarea>

  <button id="enviar">Enviar SMS</button>

  <div class="status-container" id="statusContainer"></div>
</main>

<script src="cordova.js"></script>
<script src="../plugins/cordova-plugin-termux-api-embed/www/termux-api.js"></script>
<script>
document.addEventListener("deviceready", async () => {
  const simSelect = document.getElementById("simSelect");
  const numerosInput = document.getElementById("numeros");
  const mensagemInput = document.getElementById("mensagem");
  const enviarBtn = document.getElementById("enviar");
  const statusContainer = document.getElementById("statusContainer");

  // Carregar SIMs via Termux API
  const sims = await TermuxAPI.getSimInfo(); // retorna [{carrierName:"Movitel"}, {carrierName:"Mcel"}]
  simSelect.innerHTML = sims.map((sim,i)=>`<option value="${i}">${sim.carrierName || 'SIM'+(i+1)}</option>`).join('');

  enviarBtn.addEventListener("click", async () => {
    const mensagem = mensagemInput.value.trim();
    const numeros = numerosInput.value.replace(/[^0-9,]/g,"").split(",").flatMap(n=>n.match(/\d{9}/g)||[]);
    const simIndex = parseInt(simSelect.value);
    if(!mensagem||numeros.length===0){ alert("Preencha todos os campos."); return; }
    statusContainer.innerHTML="";
    for(const numero of numeros){
      const card=document.createElement("div");
      card.className="status-card";
      card.innerHTML=`<strong>${numero}</strong><span>Enviando...</span>`;
      statusContainer.appendChild(card);
      try{
        await TermuxAPI.sendSMS(numero, mensagem, simIndex);
        card.innerHTML=`<strong>${numero}</strong><span class="status-success">✅ Enviado</span>
          <button class="btn-small" onclick="this.parentNode.remove()">Excluir</button>
          <button class="btn-small" onclick="reenviar('${numero}',${simIndex},this)">Reenviar</button>`;
      }catch(e){
        card.innerHTML=`<strong>${numero}</strong><span class="status-error">❌ Erro</span>
          <button class="btn-small" onclick="this.parentNode.remove()">Excluir</button>
          <button class="btn-small" onclick="reenviar('${numero}',${simIndex},this)">Reenviar</button>`;
      }
    }
  });

});

async function reenviar(numero, simIndex, btn){
  const card=btn.parentNode;
  card.querySelector(".status-error")&&(card.querySelector(".status-error").textContent="Reenviando...");
  try{
    await TermuxAPI.sendSMS(numero, "Reenvio de teste", simIndex);
    card.innerHTML=`<strong>${numero}</strong><span class="status-success">✅ Reenviado</span>
      <button class="btn-small" onclick="this.parentNode.remove()">Excluir</button>`;
  }catch(e){
    card.querySelector(".status-error")&&(card.querySelector(".status-error").textContent="❌ Erro no reenvio");
  }
}
</script>

</body>
</html>
